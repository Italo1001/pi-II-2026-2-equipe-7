name: Validar backend e FRONTEND 2
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: JurisFacil/backend/pom.xml
      - name: Testar backend
        working-directory: JurisFacil/backend
        run: bash mvnw --batch-mode test
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 43c3dfaf504051ed90102b2ae1e7d3a66ee6b321
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: JurisFacil/frontend/package-lock.json
      - name: Instalar e validar frontend do PR 156
        working-directory: JurisFacil/frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
