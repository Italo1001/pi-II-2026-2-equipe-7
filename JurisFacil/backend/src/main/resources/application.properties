# Aplicação
spring.application.name=jurisfacil-backend

# Banco de dados - PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/JurisFacil
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Servidor
server.port=8080

# JWT: configure JWT_SECRET com pelo menos 32 bytes antes de iniciar a aplicação
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:PT1H}